<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>Verifiche periodiche</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona-192.png">
<link rel="apple-touch-icon" href="icona-192.png">
<style>
:root{
  --blu:#1f4e79; --blu2:#2e6da4; --chiaro:#eaf1f8; --sfondo:#f4f6f8; --testo:#1d2733; --grigio:#5f6b78;
  --bordo:#cfd7df; --verde:#2e7d32; --rosso:#b3261e; --giallo:#8a6d00; --bianco:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--sfondo);color:var(--testo);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--blu);color:#fff;padding:10px 14px;
  display:flex;align-items:center;gap:10px;min-height:56px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:0;color:#fff;font-size:22px;padding:6px 10px;min-width:44px;min-height:44px}
main{padding:14px;max-width:760px;margin:0 auto 90px}
h2{font-size:17px;margin:20px 0 8px;color:var(--blu)}
h2:first-child{margin-top:4px}
p{margin:6px 0}
.nota{color:var(--grigio);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px 16px;font-size:17px;font-weight:600;
  background:var(--blu);color:#fff;margin:8px 0;text-align:center;min-height:52px}
.btn.secondario{background:#fff;color:var(--blu);border:1.5px solid var(--blu)}
.btn.pericolo{background:#fff;color:var(--rosso);border:1.5px solid var(--rosso)}
.btn.verde{background:var(--verde)}
.btn:disabled{opacity:.45}
.riga-btn{display:flex;gap:8px}
.riga-btn .btn{flex:1}
.scheda{background:#fff;border:1px solid var(--bordo);border-radius:12px;padding:12px 14px;margin:8px 0}
.voce{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--bordo);border-radius:10px;
  padding:11px 13px;margin:6px 0;font-size:16px;color:var(--testo)}
.voce b{display:block}
.voce small{color:var(--grigio);display:block}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.chip.bozza{background:#fff3cd;color:var(--giallo)}
.chip.pronta{background:#dcefdc;color:var(--verde)}
.chip.inviata{background:var(--chiaro);color:var(--blu2)}
.chip.importata{background:#e5e5e5;color:#444}
.chip.nuova{background:#f3e5f5;color:#6a1b9a}
label.campo{display:block;margin:12px 0 0;font-size:14px;font-weight:600;color:var(--grigio)}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=email],input[type=tel],input[type=password],select,textarea{
  display:block;width:100%;font-size:17px;padding:11px 12px;margin-top:4px;border:1.5px solid var(--bordo);
  border-radius:9px;background:#fff;color:var(--testo);min-height:48px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blu2)}
.due{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tre{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.spunta{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:17px}
.spunta input{width:24px;height:24px}
.scelte{display:flex;gap:8px;margin-top:4px}
.scelte button{flex:1;padding:12px 6px;border:1.5px solid var(--bordo);border-radius:9px;background:#fff;font-size:16px;color:var(--testo);min-height:48px}
.scelte button.on{border-color:var(--blu);background:var(--chiaro);color:var(--blu);font-weight:700}
.famiglie button{display:block;width:100%;padding:20px;margin:10px 0;font-size:19px;font-weight:700;border-radius:12px;
  border:1.5px solid var(--blu);background:#fff;color:var(--blu)}
.blocco{border:1px solid var(--bordo);border-radius:10px;padding:4px 12px 12px;margin:10px 0;background:#fbfcfd}
.blocco h3{font-size:15px;margin:10px 0 0;display:flex;justify-content:space-between;align-items:center}
.blocco h3 button{border:0;background:none;color:var(--rosso);font-size:14px;padding:6px}
.foto{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:6px}
.foto figure{margin:0;background:#fff;border:1px solid var(--bordo);border-radius:8px;overflow:hidden}
.foto img{width:100%;height:100px;object-fit:cover;display:block}
.foto figcaption{font-size:12px;padding:4px 6px;display:flex;justify-content:space-between;gap:4px}
.foto figcaption button{border:0;background:none;color:var(--rosso);font-size:12px;padding:0}
.info{background:var(--chiaro);border-radius:10px;padding:10px 12px;font-size:15px}
.info b{color:var(--blu)}
.avviso{background:#fff3cd;color:#5c4700;border-radius:10px;padding:10px 12px;font-size:15px;margin:8px 0}
.errore{background:#fdecea;color:var(--rosso);border-radius:10px;padding:10px 12px;font-size:15px;margin:8px 0}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bordo);padding:8px 14px;
  display:flex;gap:8px;z-index:4}
.barra .btn{margin:0}
.salvato{font-size:13px;color:var(--grigio);text-align:right;min-height:18px}
#velo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#velo.aperto{display:flex}
#finestra{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px 14px;max-height:85vh;overflow:auto}
#finestra h3{margin:0 0 8px;font-size:18px}
.vuoto{color:var(--grigio);text-align:center;padding:22px 8px}
.conteggio{font-size:28px;font-weight:700;color:var(--blu)}
/* scheda serbatoi: anteprima sul telefono e stampa */
.foglio-box{overflow-x:auto;margin:10px -14px 0;padding:0 14px 20px}
.foglio{background:#fff;color:#000;width:1050px;padding:18px 22px;border:1px solid var(--bordo);font:12px/1.3 Arial,Helvetica,sans-serif}
.foglio .intest{display:flex;align-items:flex-start;gap:28px;margin-bottom:10px}
.foglio .intest img{height:50px}
.foglio .dip{font-weight:700;font-size:13px;text-align:center;padding-top:8px}
.foglio .serv{font-size:10px;text-align:center;margin-left:60px;padding-top:2px}
.foglio .tit{text-align:center;font-weight:700;font-size:13px;margin:8px 0 2px}
.foglio .sottotit{text-align:center;font-size:11px;margin-bottom:8px}
.foglio table.ditta{margin:0 0 10px 160px;border-collapse:collapse}
.foglio table.ditta th{text-align:left;padding:1px 14px 1px 0;font-size:11px}
.foglio table.ditta td{font-size:11px}
.foglio table.tab{width:100%;border-collapse:collapse}
.foglio table.tab th{border:1px solid #000;font-size:10px;font-weight:700;padding:5px 4px;background:#eaf1f8}
.foglio table.tab td{border:1px solid #000;font-size:10.5px;padding:4px 5px;vertical-align:middle}
.foglio table.tab td.c{text-align:center}
.foglio table.tab td.esito{padding:0;width:23%}
.foglio table.esiti{width:100%;border-collapse:collapse}
.foglio table.esiti td{border:0;border-bottom:1px solid #999;padding:3px 5px;font-size:10px}
.foglio table.esiti tr:last-child td{border-bottom:0}
.foglio table.esiti td.et{color:#444;width:52%}
.foglio table.esiti td.val{font-weight:700}
.foglio .nonidoneo{color:#c00000;font-weight:700;margin-top:4px}
.foglio .nota-doc{font-size:9px;color:#555;margin:6px 0 14px}
.foglio .piede{display:flex;gap:60px;justify-content:center;font-size:9px;border-top:1px solid #d33;padding-top:6px}
.foglio tr{page-break-inside:avoid}
input.chiave{-webkit-text-security:disc}
/* taratura valvole: limiti UNI EN ISO 4126-1 */
.iso{border:1.5px solid var(--blu2);background:#f3f8fd;border-radius:12px;padding:10px 12px;margin:14px 0 4px}
.iso-tit{font-size:12.5px;font-weight:700;color:var(--blu);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.iso-et{font-size:13px;color:var(--grigio);font-weight:600}
.iso-val{font-size:30px;font-weight:700;color:var(--blu);line-height:1.15;margin:2px 0}
.iso-val span{font-size:16px;font-weight:600}
.iso-sotto{font-size:13px;color:var(--grigio)}
.iso-riga{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--bordo)}
.iso-riga b{font-size:16px;display:block;margin:2px 0}
.iso-fluido button{padding:8px 6px;min-height:42px;font-size:15px}
.iso-ap{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;margin-top:2px}
.iso-ap[hidden]{display:none}
.iso-ok,.iso-ko,.iso-vuoto{border-radius:9px;padding:8px 10px;min-height:48px;display:flex;align-items:center;font-size:15px}
.iso-ok{background:#dcefdc;color:var(--verde);font-weight:700;font-size:17px}
.iso-ko{background:#fdecea;color:var(--rosso);font-weight:700}
.iso-vuoto{color:var(--grigio);font-size:13px;line-height:1.25}
.iso-app{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.iso-app b{display:block;font-size:17px}
.iso-app .btn{width:auto;margin:0;padding:8px 16px;min-height:42px}
/* avviso di versione nuova dell'app */
#aggiornamento{position:fixed;top:64px;left:10px;right:10px;max-width:740px;margin:0 auto;z-index:15;display:flex;
  align-items:center;gap:8px;background:#1d2733;color:#fff;border-radius:12px;padding:8px 6px 8px 14px;font-size:15px;
  box-shadow:0 4px 16px rgba(0,0,0,.3)}
#aggiornamento span{flex:1}
#aggiornamento .agg-si{border:0;border-radius:8px;background:#fff;color:var(--blu);font-weight:700;font-size:15px;
  padding:8px 14px;min-height:44px}
#aggiornamento .agg-no{border:0;background:none;color:#fff;font-size:24px;min-width:44px;min-height:44px}
/* rilievi spessimetrici: caselle nella verifica, allegato nella scheda */
.spess-punto{margin:10px 0 4px}
.spess-testa{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.spess-min{font-size:13px;color:var(--grigio)}
.spess-griglia{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:5px}
.spess-griglia input{min-height:44px;padding:8px 4px;text-align:center;font-size:17px;margin:0;display:block;width:100%;
  border:1.5px solid var(--bordo);border-radius:8px;background:#fff;color:var(--testo);font-family:inherit}
.spess-griglia input:focus{outline:none;border-color:var(--blu2)}
.spess-griglia input::placeholder{color:#b6bec7;font-size:13px}
.foglio .rif{font-weight:400;font-style:italic;font-size:9px;color:#333}
.foglio.nuova-pagina{margin-top:14px;page-break-before:always;break-before:page}
.foglio .spieg{font-size:10.5px;margin:0 0 10px}
.foglio .serb{margin:0 0 14px;page-break-inside:avoid;break-inside:avoid}
.foglio .serb-tit{font-size:11px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.foglio .serb-tit .num{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;
  background:#1f4e79;color:#fff;text-align:center;font-weight:700;font-size:11px}
.foglio table.spess{width:100%;border-collapse:collapse;table-layout:fixed}
.foglio table.spess th,.foglio table.spess td{border:1px solid #000;padding:5px 4px;font-size:10.5px}
.foglio table.spess thead th{background:#eaf1f8;font-size:10px}
.foglio table.spess th.punto{width:15%;text-align:left;padding-left:8px}
.foglio table.spess tbody th.punto{background:#f6f8fa}
.foglio table.spess .n{text-align:center}
.foglio table.spess thead th.n{width:6.2%}
.foglio table.spess .min{background:#fff6dc}
.foglio table.spess thead th.min{background:#fbe8b0}
@media print{

  @page{size:A4 landscape;margin:9mm}
  html,body{background:#fff!important}
  header,.barra,.no-stampa,#velo,#aggiornamento{display:none!important}
  main{padding:0;margin:0;max-width:none}
  .foglio-box{overflow:visible;margin:0;padding:0}
  .foglio{border:0;padding:0;width:auto}
  .foglio.nuova-pagina{margin-top:0}
}
</style>
</head>
<body>
<header>
  <button id="indietro" aria-label="Indietro" hidden>&#8592;</button>
  <h1 id="titolo">Verifiche periodiche</h1>
  <button id="menu" aria-label="Impostazioni">&#9881;</button>
</header>
<main id="vista"></main>
<div id="velo"><div id="finestra"></div></div>
<input type="file" id="sceltaElenco" accept=".json,application/json,text/plain" hidden>
<script src="app.js"></script>
<script src="estrai.js"></script>
<script src="lettura.js"></script>
<script src="scheda.js"></script>
<script src="taratura.js"></script>
</body>
</html>
